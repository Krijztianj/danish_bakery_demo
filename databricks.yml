bundle:
  name: swirl-metric-views-demo

include:
  - resources/dashboard.yml
  - resources/genie_space.yml
  # Optional: publish sales_metrics to Power BI. Needs the "Publish Metric Views To Power BI"
  # preview, a Unity Catalog connection of type Power BI and a PPU / Premium / Fabric workspace.
  # See "Optional: Power BI" in the README before uncommenting.
  # - resources/powerbi_job.yml

variables:
  catalog:
    description: Catalog for the demo (created by the setup notebook if allowed)
    default: swirl_demo
  schema:
    description: Schema for the demo
    default: bakery
  scale:
    description: Data volume. 0.5 ≈ 5M order lines, 1.0 ≈ 10M
    default: "0.5"
  warehouse_id:
    description: Serverless SQL warehouse used by the app, dashboard, Genie and Power BI
  powerbi_workspace:
    description: (Power BI only) Name of the Power BI workspace (PPU / Premium / Fabric) to publish to
    default: "Swirl Demo"
  powerbi_connection:
    description: (Power BI only) Name of the Unity Catalog connection of type Power BI
    default: "powerbi"
  powerbi_model_name:
    description: (Power BI only) Name of the Power BI semantic model
    default: "Swirl Sales (metric view)"

resources:
  jobs:
    swirl_setup:
      name: "Swirl & Sons – 1. Build demo data and metric views"
      tasks:
        - task_key: create_schema
          notebook_task:
            notebook_path: ./src/00_setup.py
            base_parameters: {catalog: "${var.catalog}", schema: "${var.schema}"}
        - task_key: generate_data
          depends_on: [{task_key: create_schema}]
          notebook_task:
            notebook_path: ./src/01_generate_data.py
            base_parameters: {catalog: "${var.catalog}", schema: "${var.schema}", scale: "${var.scale}"}
        - task_key: metric_views
          depends_on: [{task_key: generate_data}]
          notebook_task:
            notebook_path: ./src/02_create_metric_views.py
            base_parameters: {catalog: "${var.catalog}", schema: "${var.schema}"}
        - task_key: legacy_views
          depends_on: [{task_key: generate_data}]
          notebook_task:
            notebook_path: ./src/03_legacy_views.py
            base_parameters: {catalog: "${var.catalog}", schema: "${var.schema}"}

    # Optional nightly refresh: regenerates the data up to yesterday so "last month" and the
    # app's "last 28 days" stay current. Paused by default; unpause it in the Jobs UI if you
    # keep the demo running for a while.
    swirl_refresh:
      name: "Swirl & Sons – 2. Nightly data refresh"
      schedule:
        quartz_cron_expression: "0 30 4 * * ?"
        timezone_id: Europe/Copenhagen
        pause_status: PAUSED
      tasks:
        - task_key: generate_data
          notebook_task:
            notebook_path: ./src/01_generate_data.py
            base_parameters: {catalog: "${var.catalog}", schema: "${var.schema}", scale: "${var.scale}"}

  apps:
    swirl_cockpit:
      name: swirl-store-cockpit
      description: "Store Cockpit – every number from Unity Catalog metric views"
      source_code_path: ./app
      user_api_scopes: [sql, dashboards.genie]
      # App config lives here (not in app/app.yaml) so catalog/schema follow the bundle variables.
      config:
        command: ["streamlit", "run", "app.py"]
        env:
          - name: DATABRICKS_WAREHOUSE_ID
            value_from: sql-warehouse
          - name: GENIE_SPACE_ID
            value_from: genie-space
          - name: MV_CATALOG
            value: ${var.catalog}
          - name: MV_SCHEMA
            value: ${var.schema}
          - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
            value: "false"
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: genie-space
          genie_space:
            name: swirl-genie
            space_id: ${resources.genie_spaces.swirl_genie.id}
            permission: CAN_RUN

targets:
  dev:
    mode: development
    default: true
