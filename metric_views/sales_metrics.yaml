version: 1.1
comment: >-
  Swirl & Sons sales semantic layer – the ONE definition of revenue, margin, basket and customers.
  Grain: order line. Used by AI/BI dashboards, Genie, the Store Manager app and Power BI.
source: ${catalog}.${schema}.fact_sales

joins:
  - name: store
    source: ${catalog}.${schema}.dim_store
    'on': source.store_id = store.store_id
  - name: product
    source: ${catalog}.${schema}.dim_product
    'on': source.product_id = product.product_id
  - name: customer
    source: ${catalog}.${schema}.dim_customer
    'on': source.customer_id = customer.customer_id

fields:
  # ---------------- Time ----------------
  - name: order_date
    expr: source.order_date
    display_name: Order Date
    comment: Calendar date of the order (Europe/Copenhagen).
    synonyms: [date, day]
  - name: order_week
    expr: DATE_TRUNC('WEEK', source.order_date)
    display_name: Order Week
    comment: Monday of the ISO week of the order.
    synonyms: [week]
  - name: order_month
    expr: DATE_TRUNC('MONTH', source.order_date)
    display_name: Order Month
    comment: First day of the order month.
    synonyms: [month]
  - name: order_year
    expr: YEAR(source.order_date)
    display_name: Order Year
    synonyms: [year]
  - name: weekday
    expr: DATE_FORMAT(source.order_date, 'EEEE')
    display_name: Weekday
    comment: Day of week name, e.g. Friday.
    synonyms: [day of week]
  - name: daypart
    expr: >-
      CASE WHEN source.order_hour < 10 THEN '1 Morning rush (06-10)'
           WHEN source.order_hour < 12 THEN '2 Late morning (10-12)'
           WHEN source.order_hour < 14 THEN '3 Lunch (12-14)'
           WHEN source.order_hour < 17 THEN '4 Afternoon (14-17)'
           ELSE '5 Evening (17+)' END
    display_name: Daypart
    comment: Time-of-day bucket based on the order hour.
    synonyms: [time of day]

  # ---------------- Store & channel ----------------
  - name: store_name
    expr: store.store_name
    display_name: Store
    synonyms: [store, shop, bakery, location, branch]
  - name: city
    expr: store.city
    display_name: City
    synonyms: [town]
  - name: region
    expr: store.region
    display_name: Region
    comment: Danish region (Central Denmark, Capital Region, Southern Denmark, North Denmark). Webshop & App is National.
    synonyms: [area]
  - name: store_format
    expr: store.store_format
    display_name: Store Format
    comment: Flagship, Station, Campus, Neighbourhood or Online.
    synonyms: [format, store type]
  - name: channel
    expr: source.channel
    display_name: Channel
    comment: In-store, Click & Collect (app) or Delivery (webshop).
    synonyms: [sales channel]

  # ---------------- Product ----------------
  - name: product_name
    expr: product.product_name
    display_name: Product
    comment: Product name, e.g. Cinnamon Swirl, Rye Bread, Caffe Latte.
    synonyms: [product, item, pastry, SKU]
  - name: product_category
    expr: product.category
    display_name: Product Category
    comment: Pastry, Bread, Cakes, Seasonal, Drinks or Lunch.
    synonyms: [category, product group]
  - name: promo_code
    expr: source.promo_code
    display_name: Promo Code
    comment: SWIRLFRIDAY = 2-for-1 cinnamon swirls on Fridays in Copenhagen stores (from March 2026).
    synonyms: [campaign, promotion]

  # ---------------- Customer ----------------
  - name: customer_segment
    expr: COALESCE(customer.segment, 'Walk-in (anonymous)')
    display_name: Customer Segment
    comment: Student, Commuter, Family, Business – or Walk-in for anonymous customers.
    synonyms: [segment]
  - name: loyalty_tier
    expr: COALESCE(customer.loyalty_tier, 'Not a member')
    display_name: Loyalty Tier
    synonyms: [tier, membership level]
  - name: member_status
    expr: CASE WHEN source.customer_id IS NULL THEN 'Non-member' ELSE 'Loyalty member' END
    display_name: Member Status
    synonyms: [loyalty member]

  # ---------------- Measure inputs ----------------
  # Power BI publishing computes measures in DAX from the published columns,
  # so every column a measure reads must also be exposed as a field.
  # Hide these in Power BI; they are not meant for slicing.
  - name: order_id
    expr: source.order_id
    comment: '[measure input] Order identifier.'
  - name: customer_id
    expr: source.customer_id
    comment: '[measure input] Loyalty member id, NULL for walk-ins.'
  - name: quantity
    expr: source.quantity
    comment: '[measure input] Units on the order line.'
  - name: gross_amount
    expr: source.gross_amount
    comment: '[measure input] DKK incl. VAT before discounts.'
  - name: discount_amount
    expr: source.discount_amount
    comment: '[measure input] Discount in DKK incl. VAT.'
  - name: net_amount
    expr: source.net_amount
    comment: '[measure input] DKK excl. VAT after discounts.'
  - name: cost_amount
    expr: source.cost_amount
    comment: '[measure input] Cost of goods in DKK excl. VAT.'
  - name: is_refunded
    expr: source.is_refunded
    comment: '[measure input] Line was refunded.'
  - name: is_staff_purchase
    expr: source.is_staff_purchase
    comment: '[measure input] Employee purchase at staff discount.'

measures:
  # ---------------- Revenue ----------------
  - name: net_revenue
    expr: SUM(net_amount) FILTER (WHERE NOT is_refunded)
    display_name: Net Revenue
    comment: >-
      THE official revenue number: DKK excl. 25% VAT, after discounts, excluding refunded lines.
    format: {type: currency, currency_code: DKK, decimal_places: {type: max, places: 0}, abbreviation: compact}
    synonyms: [revenue, sales, net sales, turnover, takings, top line]
  - name: gross_sales_incl_vat
    expr: SUM(gross_amount) FILTER (WHERE NOT is_refunded)
    display_name: Gross Sales (incl. VAT)
    comment: Shelf-price value incl. VAT before discounts. Not revenue – use Net Revenue for revenue questions.
    format: {type: currency, currency_code: DKK, decimal_places: {type: max, places: 0}, abbreviation: compact}
    synonyms: [gross sales, shelf value]
  - name: discounts
    expr: SUM(discount_amount) FILTER (WHERE NOT is_refunded)
    display_name: Discounts (incl. VAT)
    comment: Campaign and staff discounts in DKK incl. VAT.
    format: {type: currency, currency_code: DKK, decimal_places: {type: max, places: 0}, abbreviation: compact}
    synonyms: [markdowns]
  - name: refunds
    expr: SUM(net_amount) FILTER (WHERE is_refunded)
    display_name: Refunds
    comment: Net value (excl. VAT) of refunded order lines.
    format: {type: currency, currency_code: DKK, decimal_places: {type: max, places: 0}, abbreviation: compact}
    synonyms: [returns]

  # ---------------- Margin ----------------
  - name: cogs
    expr: SUM(cost_amount) FILTER (WHERE NOT is_refunded)
    display_name: Cost of Goods Sold
    comment: Ingredient and packaging cost of sold goods, DKK excl. VAT.
    format: {type: currency, currency_code: DKK, decimal_places: {type: max, places: 0}, abbreviation: compact}
    synonyms: [cost, COGS]
  - name: gross_margin
    expr: MEASURE(net_revenue) - MEASURE(cogs)
    display_name: Gross Margin
    comment: Net Revenue minus Cost of Goods Sold.
    format: {type: currency, currency_code: DKK, decimal_places: {type: max, places: 0}, abbreviation: compact}
    synonyms: [margin, profit]
  - name: gross_margin_pct
    expr: MEASURE(gross_margin) / MEASURE(net_revenue)
    display_name: Gross Margin %
    comment: Gross Margin divided by Net Revenue. Ratio of sums – never average this.
    format: {type: percentage, decimal_places: {type: exact, places: 1}}
    synonyms: [margin percent, margin rate]

  # ---------------- Volume & basket ----------------
  - name: orders
    expr: COUNT(DISTINCT order_id)
    display_name: Orders
    comment: Number of distinct orders (baskets).
    format: {type: number, decimal_places: {type: exact, places: 0}, abbreviation: compact}
    synonyms: [transactions, baskets, receipts]
  - name: units_sold
    expr: SUM(quantity) FILTER (WHERE NOT is_refunded)
    display_name: Units Sold
    format: {type: number, decimal_places: {type: exact, places: 0}, abbreviation: compact}
    synonyms: [units, quantity, items sold]
  - name: avg_basket
    expr: MEASURE(net_revenue) / MEASURE(orders)
    display_name: Average Basket
    comment: Net Revenue per order. Ratio of sums, not an average of line amounts.
    format: {type: currency, currency_code: DKK, decimal_places: {type: exact, places: 2}}
    synonyms: [AOV, average order value, basket size]

  # ---------------- Customers ----------------
  - name: unique_customers
    expr: COUNT(DISTINCT customer_id)
    display_name: Unique Customers
    comment: Distinct loyalty members who bought. Not additive across stores or periods.
    format: {type: number, decimal_places: {type: exact, places: 0}, abbreviation: compact}
    synonyms: [customers, members, active members]
  - name: member_revenue
    expr: SUM(net_amount) FILTER (WHERE NOT is_refunded AND customer_id IS NOT NULL)
    display_name: Member Revenue
    comment: Net Revenue from identified loyalty members.
    format: {type: currency, currency_code: DKK, decimal_places: {type: max, places: 0}, abbreviation: compact}
    synonyms: [loyalty revenue, club revenue]
  - name: member_revenue_share
    expr: MEASURE(member_revenue) / MEASURE(net_revenue)
    display_name: Member Revenue Share
    comment: Share of Net Revenue coming from loyalty members.
    format: {type: percentage, decimal_places: {type: exact, places: 1}}
    synonyms: [loyalty share, member share]
  - name: revenue_per_customer
    expr: MEASURE(member_revenue) / MEASURE(unique_customers)
    display_name: Revenue per Member
    comment: Member Revenue divided by Unique Customers.
    format: {type: currency, currency_code: DKK, decimal_places: {type: exact, places: 0}}
    synonyms: [spend per customer, customer value]
  - name: discount_rate
    expr: MEASURE(discounts) / MEASURE(gross_sales_incl_vat)
    display_name: Discount Rate
    comment: Discounts as a share of Gross Sales (both incl. VAT).
    format: {type: percentage, decimal_places: {type: exact, places: 1}}
    synonyms: [discount %]

  # ---------------- Time intelligence (window measures are Experimental) ----------------
  - name: net_revenue_trailing_7d
    expr: SUM(net_amount) FILTER (WHERE NOT is_refunded)
    window:
      - order: order_date
        range: trailing 7 day
        semiadditive: last
    display_name: Net Revenue (prior 7 days)
    comment: Net Revenue of the 7 days before each date (rolling). Group by Order Date.
    format: {type: currency, currency_code: DKK, decimal_places: {type: max, places: 0}, abbreviation: compact}
    synonyms: [rolling 7 day revenue, last 7 days revenue]
  - name: net_revenue_prior_month
    expr: SUM(net_amount) FILTER (WHERE NOT is_refunded)
    window:
      - order: order_month
        range: trailing 1 month
        semiadditive: last
    display_name: Net Revenue (prior month)
    comment: Net Revenue of the previous month. Group by Order Month.
    format: {type: currency, currency_code: DKK, decimal_places: {type: max, places: 0}, abbreviation: compact}
    synonyms: [last month revenue, previous month revenue]
  - name: net_revenue_mom_growth
    expr: (MEASURE(net_revenue) - MEASURE(net_revenue_prior_month)) / MEASURE(net_revenue_prior_month)
    display_name: Net Revenue MoM Growth
    comment: Month-over-month growth of Net Revenue. Group by Order Month.
    format: {type: percentage, decimal_places: {type: exact, places: 1}}
    synonyms: [month over month growth, MoM]
